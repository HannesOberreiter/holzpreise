name: Deploy holzpreise

on:
  push:
    branches: [main]
    paths:
      - "**.qmd"
      - "_quarto.yml"
      - "styles.css"
      - "assets/**"
      - "scripts/**"
      - "edge-script.ts"
      - "DESCRIPTION"
      - "renv.lock"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:
  schedule:
    - cron: "17 4 * * 1"

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: renv
          use-public-rspm: true

      - uses: quarto-dev/quarto-actions/setup@v2

      - uses: r-lib/actions/setup-renv@v2

      - name: Fetch raw data
        run: scripts/fetch_raw.sh

      - name: Process data
        run: |
          Rscript scripts/process_tirol_wdb.R
          Rscript scripts/process_inflation.R
          Rscript scripts/process_context_indices.R
          Rscript scripts/process_agrarforschung_prices.R

      - name: Render site
        run: quarto render

      - name: Deploy to Bunny Storage
        env:
          STORAGE_PASSWORD: ${{ secrets.HOLZPREISE_STORAGE_PASSWORD }}
          STORAGE_ZONE_NAME: ${{ vars.HOLZPREISE_STORAGE_ZONE_NAME }}
        run: |
          BASE_URL="https://storage.bunnycdn.com/${STORAGE_ZONE_NAME}/"

          echo "Deleting existing files..."
          curl -s -w "\nHTTP_CODE:%{http_code}" -H "AccessKey: ${STORAGE_PASSWORD}" "${BASE_URL}" > /tmp/response.txt

          http_code=$(grep "HTTP_CODE:" /tmp/response.txt | cut -d: -f2)
          if [ "$http_code" != "200" ]; then
            echo "ERROR: Failed to list files (HTTP $http_code)"
            cat /tmp/response.txt
            exit 1
          fi

          sed '/HTTP_CODE:/d' /tmp/response.txt > /tmp/objects.json
          python3 - <<'PY' > /tmp/objects.tsv
          import json
          with open('/tmp/objects.json') as f:
              objects = json.load(f)
          for obj in objects:
              name = obj.get('ObjectName')
              if name:
                  print(f"{name}\t{str(obj.get('IsDirectory', False)).lower()}")
          PY

          if [ -s /tmp/objects.tsv ]; then
            while IFS=$'\t' read -r name is_directory; do
              suffix=""
              if [ "$is_directory" = "true" ]; then
                suffix="/"
              fi
              echo "Deleting: ${name}${suffix}"
              curl -X DELETE -H "AccessKey: ${STORAGE_PASSWORD}" "${BASE_URL}${name}${suffix}" -s --fail || true
            done < /tmp/objects.tsv
          fi

          echo "Uploading new files..."
          cd _site
          find . -type f > /tmp/files.txt

          while IFS= read -r file; do
            path="${file#./}"
            echo "Uploading: $path"
            curl -X PUT "${BASE_URL}${path}" -H "AccessKey: ${STORAGE_PASSWORD}" \
              --data-binary "@$file" --fail -s || exit 1
          done < /tmp/files.txt

          echo "Deployment complete!"

      - name: Purge BunnyCDN cache
        env:
          BUNNY_API_KEY: ${{ secrets.BUNNY_API_KEY }}
          PULL_ZONE_ID: ${{ vars.HOLZPREISE_PULL_ZONE_ID }}
        run: |
          curl -X POST "https://api.bunny.net/pullzone/${PULL_ZONE_ID}/purgeCache" \
            -H "AccessKey: ${BUNNY_API_KEY}" --fail -s
          echo "Cache purged."

# Required GitHub secrets / variables (repo Settings → Secrets and variables):
#   Secrets: HOLZPREISE_STORAGE_PASSWORD, BUNNY_API_KEY
#   Variables: HOLZPREISE_STORAGE_ZONE_NAME, HOLZPREISE_PULL_ZONE_ID
